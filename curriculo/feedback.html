<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback do Contratante - Nicole da Costa Bispo</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        /* Navbar Transparente */
        .navbar {
            background: rgba(15, 23, 42, 0.6) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Card de Vidro Retorcido (Glassmorphism) */
        .feedback-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.2) !important;
            border-radius: 24px !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Inputs do Formulário */
        .form-control-custom, .form-select-custom {
            background: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-radius: 10px;
            padding: 0.75rem;
        }

        .form-control-custom:focus, .form-select-custom:focus {
            border-color: #a855f7 !important;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3) !important;
        }

        /* Ajuste para opções do select ficarem visíveis no tema escuro */
        .form-select-custom option {
            background-color: #0f172a;
            color: #ffffff;
        }

        /* Sistema de Estrelas Interativas */
        .rating-wrapper {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 8px;
        }

        .rating-wrapper input {
            display: none;
        }

        .rating-wrapper label {
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .rating-wrapper label:hover,
        .rating-wrapper label:hover ~ label,
        .rating-wrapper input:checked ~ label {
            color: #ffca28;
        }

        /* Botão Enviar com Degradê */
        .btn-send {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark py-3 shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5 tracking-tight d-flex align-items-center gap-2" href="index.html">
                <span style="background: linear-gradient(to right, #ffffff, #cbd5e1); -webkit-text-fill-color: transparent text;">
                   Currículo Online
                </span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item"><a class="nav-link px-3 text-white-50" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-white-50" href="portfolio.html">Portfólio</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-white-50" href="formacao.html">Formação</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-white-50" href="habilidades.html">Habilidades</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-white-50" href="contato.html">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 pt-4">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                
                <div class="card feedback-card shadow p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-2" style="background: linear-gradient(to right, #ffffff, #a855f7); -webkit-text-fill-color: transparent text;">
                            Espaço do Contratante
                        </h2>
                        <p class="text-light opacity-75 small">
                            Se você avaliou o meu perfil para uma oportunidade, adoraria entender melhor as necessidades do seu time.
                        </p>
                    </div>

                    <form action="https://formspree.io/f/SEU_ID_DO_FORMSPREE" method="POST">
                        
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label class="form-label text-white-50 small">Seu Nome / Recrutador</label>
                                <input type="text" name="nome_recrutador" class="form-control form-control-custom" placeholder="Ex: Lucas Silva" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-white-50 small">Empresa</label>
                                <input type="text" name="empresa" class="form-control form-control-custom" placeholder="Ex: Tech Solutions" required>
                            </div>
                        </div>

                        <div class="mb-4 text-center border-bottom border-secondary border-opacity-25 pb-4">
                            <label class="form-label text-white-50 small d-block mb-2">
                                1. O quanto meu perfil atual se alinha com as vagas em aberto na sua empresa?
                            </label>
                            <div class="rating-wrapper">
                                <input type="radio" id="star5" name="alinhamento_perfil" value="5" />
                                <label for="star5" class="bi bi-star-fill" title="Totalmente alinhado"></label>
                                
                                <input type="radio" id="star4" name="alinhamento_perfil" value="4" />
                                <label for="star4" class="bi bi-star-fill" title="Muito alinhado"></label>
                                
                                <input type="radio" id="star3" name="alinhamento_perfil" value="3" />
                                <label for="star3" class="bi bi-star-fill" title="Alinhamento médio"></label>
                                
                                <input type="radio" id="star2" name="alinhamento_perfil" value="2" />
                                <label for="star2" class="bi bi-star-fill" title="Pouco alinhado"></label>
                                
                                <input type="radio" id="star1" name="alinhamento_perfil" value="1" />
                                <label for="star1" class="bi bi-star-fill" title="Não alinhado"></label>
                            </div>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-white-50 small">
                                2. Qual é o modelo de atuação predominante para o time de desenvolvimento hoje?
                            </label>
                            <select name="modelo_trabalho" class="form-select form-select-custom" required>
                                <option value="" disabled selected>Selecione uma opção...</option>
                                <option value="Remoto (Home Office)">Totalmente Remoto (Home Office)</option>
                                <option value="Híbrido">Híbrido (Presencial + Remoto)</option>
                                <option value="Presencial">Totalmente Presencial</option>
                            </select>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-white-50 small">
                                3. Pensando nos desafios atuais da empresa, qual stack ou habilidade técnica vocês mais valorizam no momento?
                            </label>
                            <input type="text" name="stack_valorizada" class="form-control form-control-custom" placeholder="Ex: React, Node.js, Clean Code, Arquitetura de Nuvem...">
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-white-50 small">
                                4. Há algum ponto em meus projetos ou portfólio que chamou sua atenção positiva ou que você recomendaria melhorar?
                            </label>
                            <textarea name="feedback_projetos" class="form-control form-control-custom" rows="4" placeholder="Sua percepção técnica ou dicas de melhoria..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-send w-100 text-uppercase tracking-wider">Enviar Respostas</button>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center p-4 mt-5" style="background: rgba(15, 23, 42, 0.8); border-top: 1px solid rgba(255, 255, 255, 0.05);">
        <p class="mb-0 text-white-50 small">
            © 2026 
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
